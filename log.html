<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  try {
    var raw = localStorage.getItem('lunatrack:theme');
    var pref = raw ? JSON.parse(raw) : 'light';
    var resolved = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
    if (resolved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Today — LunaTrack</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="app-responsive.css">
</head>
<body class="app-body" data-page="log" data-title="Log Today">

<div id="authGuardOverlay" hidden>
  <div class="luna-loader"></div>
  <p>Loading your account&hellip;</p>
  <a href="login.html" id="authGuardEscape" hidden style="font-size:13px;color:var(--c-plum);font-weight:600;">Taking longer than expected? Go to login &rarr;</a>
</div>


<a href="#appMain" class="skip-link">Skip to content</a>

<div id="mobileTopbarRoot"></div>
<div id="drawerRoot"></div>

<div class="app-shell">
  <div id="sidebarRoot"></div>

  <main class="app-main" id="appMain">
    <div class="app-main-inner" style="max-width:720px">

      <div class="app-topbar">
        <div class="topbar-title">
          <h1>Log Today</h1>
          <p id="logDateLabel">Today</p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </div>

      <div class="app-card" data-reveal>
        <div class="form-field" id="logPeriod">
          <span class="field-label">Period</span>
          <div class="pill-group">
            <button type="button" class="pill" data-value="Not started">Not started</button>
            <button type="button" class="pill" data-value="Light">Light</button>
            <button type="button" class="pill" data-value="Medium">Medium</button>
            <button type="button" class="pill" data-value="Heavy">Heavy</button>
          </div>
        </div>

        <div class="form-field" id="logSymptoms">
          <span class="field-label">Symptoms</span>
          <div class="pill-group">
            <button type="button" class="pill" data-value="Cramps">Cramps</button>
            <button type="button" class="pill" data-value="Headache">Headache</button>
            <button type="button" class="pill" data-value="Bloating">Bloating</button>
            <button type="button" class="pill" data-value="Fatigue">Fatigue</button>
            <button type="button" class="pill" data-value="Backache">Backache</button>
            <button type="button" class="pill" data-value="Tenderness">Tenderness</button>
          </div>
        </div>

        <div class="form-field" id="logMood">
          <span class="field-label">Mood</span>
          <div class="pill-group">
            <button type="button" class="pill" data-value="Great">Great</button>
            <button type="button" class="pill" data-value="Good">Good</button>
            <button type="button" class="pill" data-value="Okay">Okay</button>
            <button type="button" class="pill" data-value="Low">Low</button>
            <button type="button" class="pill" data-value="Difficult">Difficult</button>
          </div>
        </div>

        <div class="form-field" id="logEnergy">
          <span class="field-label">Energy</span>
          <div class="segmented">
            <button type="button" data-value="Low">Low</button>
            <button type="button" data-value="Normal">Normal</button>
            <button type="button" data-value="High">High</button>
          </div>
        </div>

        <div class="form-field" id="logSleep">
          <span class="field-label">Sleep</span>
          <div class="segmented">
            <button type="button" data-value="Poor">Poor</button>
            <button type="button" data-value="Fair">Fair</button>
            <button type="button" data-value="Good">Good</button>
          </div>
        </div>

        <div class="form-field" style="margin-bottom:var(--sp-5)">
          <label for="logNotes">Notes</label>
          <textarea id="logNotes" placeholder="Anything else worth remembering about today..."></textarea>
        </div>

        <button class="btn btn-primary btn-block" id="saveLogBtn">Save Today's Log</button>
      </div>

    </div>
  </main>
</div>

<div id="bottomNavRoot"></div>
<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="log.js"></script>
</body>
</html>
