<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  try {
    var raw = localStorage.getItem('lunatrack:theme');
    var pref = raw ? JSON.parse(raw) : 'light';
    var resolved = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
    if (resolved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Center — LunaTrack</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="app-responsive.css">
</head>
<body class="app-body" data-page="help" data-title="Help">

<div id="authGuardOverlay" hidden>
  <div class="luna-loader"></div>
  <p>Loading your account&hellip;</p>
  <a href="login.html" id="authGuardEscape" hidden style="font-size:13px;color:var(--c-plum);font-weight:600;">Taking longer than expected? Go to login &rarr;</a>
</div>

<a href="#appMain" class="skip-link">Skip to content</a>

<div id="mobileTopbarRoot"></div>
<div id="drawerRoot"></div>

<div class="app-shell">
  <div id="sidebarRoot"></div>

  <main class="app-main" id="appMain">
    <div class="app-main-inner" style="max-width:820px">

      <div class="app-topbar">
        <div class="topbar-title">
          <h1>Help Center</h1>
          <p>Answers to common questions about using LunaTrack.</p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </div>

      <div class="search-input-wrap" style="margin-bottom:var(--sp-6)">

          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input type="text" id="helpSearch" placeholder="Search help articles...">
      </div>

      <div class="help-categories" id="helpCategoryChips"></div>

      <div id="helpSections"></div>

      <div class="app-card" id="helpNoResults" style="display:none;text-align:center;padding:var(--sp-8)">
        <p style="color:var(--c-ink-soft)">No help articles match your search.</p>
      </div>

    </div>
  </main>
</div>

<div id="bottomNavRoot"></div>
<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script src="help-content.js"></script>
</body>
</html>
