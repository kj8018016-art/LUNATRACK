<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History — LunaTrack</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="app-responsive.css">
</head>
<body class="app-body" data-page="history" data-title="History">

<div id="authGuardOverlay" hidden>
  <div class="luna-loader"></div>
  <p>Loading your account&hellip;</p>
  <a href="login.html" id="authGuardEscape" hidden style="font-size:13px;color:var(--c-plum);font-weight:600;">Taking longer than expected? Go to login &rarr;</a>
</div>


<a href="#appMain" class="skip-link">Skip to content</a>

<div id="mobileTopbarRoot"></div>
<div id="drawerRoot"></div>

<div class="app-shell">
  <div id="sidebarRoot"></div>

  <main class="app-main" id="appMain">
    <div class="app-main-inner" style="max-width:760px">

      <div class="app-topbar">
        <div class="topbar-title">
          <h1>History</h1>
          <p>Every cycle you've logged, in one place.</p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </div>

      <div class="history-list" id="historyList" data-reveal></div>

    </div>
  </main>
</div>

<div id="bottomNavRoot"></div>

<div id="modalRoot">
  <div class="modal-backdrop" id="modalCycleSummary">
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <h3 id="csModalRange">Aug 27 – Sep 23</h3>
          <div class="card-sub" id="csModalTag" style="margin-top:2px">Current cycle</div>
        </div>
        <button class="modal-close" data-close-modal aria-label="Close">✕</button>
      </div>
      <div class="date-detail-panel" style="margin-top:0;padding-top:0;border-top:none">
        <div class="dd-row"><span>Cycle length</span><span class="v" id="csModalLength">28 days</span></div>
        <div class="dd-row"><span>Period length</span><span class="v" id="csModalPeriodLength">5 days</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-block" data-close-modal>Close</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script>
  (function () {
    const { data } = LunaApp;

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = data.cycles.map((c, i) => `
        <button class="history-row" data-index="${i}" data-reveal style="transition-delay:${i * 50}ms">
          <div>
            <div class="tag">${c.label}</div>
            <div class="range">${c.range}</div>
          </div>
          <div style="display:flex;align-items:center;gap:var(--sp-4)">
            <span class="len">${c.length} days</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
          </div>
        </button>`).join('');

      list.querySelectorAll('.history-row').forEach((row) => {
        row.addEventListener('click', () => openSummary(Number(row.dataset.index)));
      });

      LunaApp.initScrollReveal();
    }

    function openSummary(index) {
      const c = data.cycles[index];
      document.getElementById('csModalRange').textContent = c.range;
      document.getElementById('csModalTag').textContent = c.label + ' cycle';
      document.getElementById('csModalLength').textContent = c.length + ' days';
      document.getElementById('csModalPeriodLength').textContent = c.periodLength + ' days';
      LunaApp.openModal('modalCycleSummary');
    }

    renderHistory();
  })();
</script>
</body>
</html>
